<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg"
x1="0" y1="0"
x2="1" y2="1">

<stop offset="0%" stop-color="#00b4db"/>
<stop offset="100%" stop-color="#006994"/>

</linearGradient>

<linearGradient id="boat"
x1="0" y1="0"
x2="0" y2="1">

<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#b9e7f5"/>

</linearGradient>

</defs>

<!-- 3D background -->

<rect
x="20"
y="20"
width="472"
height="472"
rx="105"
fill="url(#bg)"
/>

<!-- water -->

<path
d="M70 350
Q130 315 190 350
T310 350
T430 350
L430 430
L70 430Z"
fill="#063b55"
opacity=".75"
/>

<path
d="M70 380
Q130 345 190 380
T310 380
T430 380"
fill="none"
stroke="#72e4ff"
stroke-width="18"
stroke-linecap="round"
/>

<!-- boat shadow -->

<ellipse
cx="256"
cy="330"
rx="145"
ry="28"
fill="#002b40"
opacity=".45"
/>

<!-- boat body -->

<path
d="M115 275
L397 275
L350 340
Q330 365 300 365
L205 365
Q175 365 155 340Z"
fill="url(#boat)"
stroke="#07384c"
stroke-width="10"
/>

<!-- cabin -->

<path
d="M185 275
L210 205
L315 205
L350 275Z"
fill="#eafaff"
stroke="#07384c"
stroke-width="10"
/>

<!-- cabin windows -->

<path
d="M225 220
L245 220
L245 255
L215 255Z"
fill="#008db8"/>

<path
d="M260 220
L285 220
L300 255
L260 255Z"
fill="#008db8"/>

<!-- front -->

<path
d="M350 275
L397 275
L350 340
L325 340Z"
fill="#8ed8ed"
/>

<!-- navigation signal -->

<circle
cx="270"
cy="175"
r="15"
fill="#ffffff"/>

<circle
cx="270"
cy="175"
r="28"
fill="none"
stroke="#ffffff"
stroke-width="6"
opacity=".7"/>

<!-- SeaMate -->

<text
x="256"
y="125"
text-anchor="middle"
font-family="Arial"
font-size="45"
font-weight="bold"
fill="white">
SEAMATE
</text>

</svg>
