<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeaMate Pakistan</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #gps {
      position: fixed;
      z-index: 9999;
      top: 15px;
      right: 15px;
      padding: 15px;
      background: #087ea4;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<button id="gps" onclick="getGPS()">📍 My Boat</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([24.85, 67.00], 10);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

let boat;

function getGPS() {

  if (!navigator.geolocation) {
    alert("Is mobile mein GPS available nahi hai.");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      if (boat) {
        map.removeLayer(boat);
      }

      boat = L.marker([lat, lon])
        .addTo(map)
        .bindPopup("🚤 Aapki Boat")
        .openPopup();

      map.setView([lat, lon], 16);
    },

    function(error) {

      alert(
        "GPS permission allow karein.\nError: " +
        error.message
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}

</script>

</body>
</html>
