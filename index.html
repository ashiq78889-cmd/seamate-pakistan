<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaMate Pakistan</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071923;
}

#map {
  height: 100vh;
  width: 100%;
}

/* TOP BUTTONS */
.panel {
  position: fixed;
  z-index: 9999;
  top: 10px;
  left: 8px;
  right: 8px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

button {
  padding: 10px 11px;
  border: 0;
  border-radius: 9px;
  background: #087ea4;
  color: white;
  font-weight: bold;
  font-size: 12px;
}

/* DASHBOARD */
.dashboard {
  position: fixed;
  z-index: 9999;
  bottom: 12px;
  left: 8px;
  right: 8px;
  background: rgba(5, 25, 35, 0.94);
  color: white;
  border-radius: 14px;
  padding: 12px;
}

.title {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.box {
  background: #0c3547;
  border-radius: 9px;
  padding: 8px;
  text-align: center;
}

.label {
  font-size: 11px;
  opacity: 0.8;
}

.value {
  font-size: 16px;
  font-weight: bold;
  margin-top: 3px;
}
</style>
</head>

<body>

<div class="panel">

<button onclick="startTracking()">
🚤 Start
</button>

<button onclick="stopTracking()">
⛔ Stop
</button>

<button onclick="addWaypoint()">
📌 Waypoint
</button>

<button onclick="saveRoute()">
💾 Save
</button>

<button onclick="loadRoute()">
📂 Load
</button>

<button onclick="clearTrack()">
🗑️ Clear
</button>

</div>

<div id="map"></div>


<div class="dashboard">

<div class="title">
🚤 SeaMate Pakistan
</div>

<div class="grid">

<div class="box">
<div class="label">SPEED</div>
<div class="value" id="speed">0.0 kn</div>
</div>

<div class="box">
<div class="label">HEADING</div>
<div class="value" id="heading">--°</div>
</div>

<div class="box">
<div class="label">LATITUDE</div>
<div class="value" id="lat">--</div>
</div>

<div class="box">
<div class="label">LONGITUDE</div>
<div class="value" id="lon">--</div>
</div>

<div class="box">
<div class="label">DISTANCE</div>
<div class="value" id="distance">0 m</div>
</div>

<div class="box">
<div class="label">NAUTICAL</div>
<div class="value" id="nautical">0.00 NM</div>
</div>

</div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map =
L.map("map").setView([24.85, 67.00], 10);


/* NORMAL MAP */

const streetMap =
L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom: 19,
attribution: "© OpenStreetMap contributors"
}
).addTo(map);


/* NAUTICAL MAP */

const marineMap =
L.tileLayer(
"https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
{
maxZoom: 18,
opacity: 1,
attribution: "Nautical data © OpenSeaMap"
}
).addTo(map);


/* LAYER SWITCH */

L.control.layers(
{
"🗺️ Normal Map": streetMap
},
{
"⚓ Nautical Information": marineMap
}
).addTo(map);


/* VARIABLES */

let boat = null;

let watchID = null;

let boatPosition = null;

let previousPosition = null;

let totalDistance = 0;

let trackPoints = [];

let trackLine = null;

let waypoints = [];


/* START TRACKING */

function startTracking() {

if (!navigator.geolocation) {

alert("GPS available nahi hai.");

return;

}

if (watchID !== null) {

return;

}


watchID =
navigator.geolocation.watchPosition(

function(position) {

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

const current =
[lat, lon];


/* DISTANCE */

if (previousPosition) {

const distance =
map.distance(
previousPosition,
current
);

if (distance > 1) {

totalDistance += distance;

}

}


previousPosition =
current;

boatPosition =
current;


/* TRACK */

trackPoints.push(current);


if (!trackLine) {

trackLine =
L.polyline(
trackPoints,
{
weight: 5
}
).addTo(map);

} else {

trackLine.setLatLngs(
trackPoints
);

}


/* BOAT */

if (!boat) {

boat =
L.marker(current)
.addTo(map)
.bindPopup(
"🚤 Aapki Boat"
);

} else {

boat.setLatLng(current);

}


map.setView(current);


/* SPEED */

let speedKnots = 0;

if (
position.coords.speed !== null &&
position.coords.speed >= 0
) {

speedKnots =
position.coords.speed *
1.94384;

}


/* HEADING */

let heading =
position
