<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeaMate Pakistan</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .panel {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #087ea4;
      color: white;
      font-weight: bold;
    }

    #info {
      position: fixed;
      z-index: 9999;
      bottom: 15px;
      left: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="panel">
  <button onclick="getGPS()">📍 My Boat</button>
  <button onclick="addWaypoint()">📌 Waypoint</button>
  <button onclick="clearWaypoints()">🗑️ Clear</button>
</div>

<div id="map"></div>

<div id="info">
  GPS: Waiting...<br>
  Distance: 0 m
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([24.85, 67.00], 10);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);

let boat = null;
let boatPosition = null;
let waypoints = [];


// GPS
function getGPS() {

  if (!navigator.geolocation) {
    alert("GPS available nahi hai.");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      boatPosition = [lat, lon];

      if (boat) {
        map.removeLayer(boat);
      }

      boat = L.marker([lat, lon])
        .addTo(map)
        .bindPopup("🚤 Aapki Boat")
        .openPopup();

      map.setView([lat, lon], 16);

      document.getElementById("info").innerHTML =
        "GPS: " +
        lat.toFixed(5) +
        ", " +
        lon.toFixed(5) +
        "<br>Distance: 0 m";
    },

    function(error) {
      alert("GPS permission allow karein.");
    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}


// Add waypoint
function addWaypoint() {

  if (!boatPosition) {
    alert("Pehle 📍 My Boat dabayein.");
    return;
  }

  const waypoint = L.marker(boatPosition)
    .addTo(map)
    .bindPopup("📌 Waypoint");

  waypoints.push(waypoint);

  const distance = map.distance(
    boatPosition,
    waypoint.getLatLng()
  );

  document.getElementById("info").innerHTML =
    "GPS: " +
    boatPosition[0].toFixed(5) +
    ", " +
    boatPosition[1].toFixed(5) +
    "<br>Waypoint saved: " +
    waypoints.length;
}


// Clear waypoints
function clearWaypoints() {

  waypoints.forEach(function(marker) {
    map.removeLayer(marker);
  });

  waypoints = [];

  document.getElementById("info").innerHTML =
    "GPS: Ready<br>Waypoints cleared";
}

</script>

</body>
</html>
