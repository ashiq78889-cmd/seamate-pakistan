<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeaMate Pakistan</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
  margin:0;
  width:100%;
  height:100%;
}

.buttons{
  position:fixed;
  top:10px;
  left:8px;
  right:8px;
  z-index:9999;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px;
  background:#087ea4;
  color:white;
  font-weight:bold;
}

.dashboard{
  position:fixed;
  bottom:10px;
  left:8px;
  right:8px;
  z-index:9999;
  background:#062532;
  color:white;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.box{
  background:#0d3b4d;
  padding:7px;
  border-radius:7px;
}

.small{
  font-size:11px;
}

.value{
  font-size:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="buttons">
<button onclick="startGPS()">🚤 Start</button>
<button onclick="stopGPS()">⛔ Stop</button>
<button onclick="addWaypoint()">📌 Waypoint</button>
<button onclick="saveRoute()">💾 Save</button>
<button onclick="loadRoute()">📂 Load</button>
<button onclick="clearRoute()">🗑️ Clear</button>
</div>

<div id="map"></div>

<div class="dashboard">

<div class="row">

<div class="box">
<div class="small">GPS</div>
<div class="value" id="gps">Waiting...</div>
</div>

<div class="box">
<div class="small">SPEED</div>
<div class="value" id="speed">0.0 kn</div>
</div>

<div class="box">
<div class="small">HEADING</div>
<div class="value" id="heading">--</div>
</div>

<div class="box">
<div class="small">DISTANCE</div>
<div class="value" id="distance">0 m</div>
</div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([24.85,67.00],10);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

let boatMarker = null;
let watchID = null;
let lastPosition = null;
let boatPosition = null;

let totalDistance = 0;
let route = [];
let routeLine = null;
let waypoints = [];


/* START GPS */

function startGPS(){

if(!navigator.geolocation){

alert("GPS supported nahi hai");
return;

}

if(watchID !== null){

return;

}

document.getElementById("gps").innerText =
"Finding...";

watchID =
navigator.geolocation.watchPosition(

function(pos){

const lat =
pos.coords.latitude;

const lon =
pos.coords.longitude;

const current =
[lat,lon];

boatPosition = current;


/* DISTANCE */

if(lastPosition){

const d =
map.distance(
lastPosition,
current
);

if(d > 1){

totalDistance += d;

}

}

lastPosition = current;


/* ROUTE */

route.push(current);

if(!routeLine){

routeLine =
L.polyline(
route,
{weight:5}
).addTo(map);

}else{

routeLine.setLatLngs(route);

}


/* BOAT */

if(!boatMarker){

boatMarker =
L.marker(current)
.addTo(map)
.bindPopup("🚤 Aapki Boat");

}else{

boatMarker.setLatLng(current);

}


/* SPEED */

let speed = 0;

if(pos.coords.speed !== null){

speed =
pos.coords.speed * 1.94384;

}


/* HEADING */

let heading =
pos.coords.heading;

document.getElementById("gps").innerText =
lat.toFixed(5)+
", "+
lon.toFixed(5);

document.getElementById("speed").innerText =
speed.toFixed(1)+" kn";

document.getElementById("heading").innerText =
heading === null
? "--"
: heading.toFixed(0)+"°";

document.getElementById("distance").innerText =
totalDistance.toFixed(0)+" m";

map.setView(current);

},

function(error){

alert(
"GPS error: "+
error.message
);

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:20000
}

);

}


/* STOP */

function stopGPS(){

if(watchID !== null){

navigator.geolocation.clearWatch(
watchID
);

watchID = null;

}

}


/* WAYPOINT */

function addWaypoint(){

if(!boatPosition){

alert(
"Pehle 🚤 Start dabayein"
);

return;

}

const marker =
L.marker(boatPosition)
.addTo(map)
.bindPopup("📌 Waypoint");

waypoints.push(marker);

}


/* SAVE */

function saveRoute(){

if(route.length < 2){

alert(
"Pehle thoda route record karein"
);

return;

}

localStorage.setItem(
"SeaMateRoute",
JSON.stringify(route)
);

alert(
"✅ Route save ho gaya"
);

}


/* LOAD */

function loadRoute(){

const saved =
localStorage.getItem(
"SeaMateRoute"
);

if(!saved){

alert(
"Koi saved route nahi hai"
);

return;

}

const savedRoute =
JSON.parse(saved);

if(routeLine){

map.removeLayer(routeLine);

}

routeLine =
L.polyline(
savedRoute,
{weight:5}
).addTo(map);

map.fitBounds(
routeLine.getBounds()
);

alert(
"📂 Route load ho gaya"
);

}


/* CLEAR */

function clearRoute(){

if(routeLine){

map.removeLayer(routeLine);

routeLine = null;

}

route = [];

lastPosition = null;

totalDistance = 0;

document.getElementById("distance").innerText =
"0 m";

}

</script>

</body>
</html>
