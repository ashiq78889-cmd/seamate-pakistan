<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeaMate Pakistan</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Arial,sans-serif;
background:#061923;
}

#map{
width:100%;
height:100vh;
}

/* TOP BUTTONS */

.topbar{
position:fixed;
top:10px;
left:8px;
right:8px;
z-index:9999;

display:flex;
flex-wrap:wrap;
gap:6px;

background:rgba(4,28,38,.92);
padding:7px;
border-radius:12px;
}

button{
border:0;
border-radius:8px;
padding:11px 12px;

background:#087ea4;
color:white;

font-size:13px;
font-weight:bold;
}

button:active{
transform:scale(.96);
}

/* DASHBOARD */

.dashboard{
position:fixed;

left:8px;
right:8px;
bottom:10px;

z-index:9999;

background:rgba(4,35,48,.95);
color:white;

border-radius:14px;

padding:10px;

box-shadow:0 3px 15px rgba(0,0,0,.4);
}

.title{
text-align:center;
font-size:15px;
font-weight:bold;
margin-bottom:7px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:6px;
}

.box{
background:#0d4052;
border-radius:8px;
padding:7px;
text-align:center;
}

.label{
font-size:10px;
opacity:.8;
}

.value{
font-size:14px;
font-weight:bold;
margin-top:3px;
}

/* LEAFLET */

.leaflet-control-layers{
font-size:12px;
}

</style>
</head>

<body>

<!-- BUTTONS -->

<div class="topbar">

<button id="startBtn">🚤 Start</button>

<button id="stopBtn">⛔ Stop</button>

<button id="waypointBtn">📌 Waypoint</button>

<button id="saveBtn">💾 Save</button>

<button id="loadBtn">📂 Load</button>

<button id="clearBtn">🗑️ Clear</button>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- DASHBOARD -->

<div class="dashboard">

<div class="title">
🌊 SeaMate Pakistan
</div>

<div class="grid">

<div class="box">
<div class="label">GPS</div>
<div class="value" id="gps">Waiting...</div>
</div>

<div class="box">
<div class="label">SPEED</div>
<div class="value" id="speed">0.0 kn</div>
</div>

<div class="box">
<div class="label">HEADING</div>
<div class="value" id="heading">--</div>
</div>

<div class="box">
<div class="label">DISTANCE</div>
<div class="value" id="distance">0 m</div>
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

const map = L.map("map").setView(
[24.85,67.00],
10
);


/* NORMAL MAP */

const streetMap = L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);


/* NAUTICAL MAP */

const seaMap = L.tileLayer(
"https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
{
maxZoom:18,
opacity:.9,
attribution:"© OpenSeaMap contributors"
}
).addTo(map);


/* MAP LAYERS */

L.control.layers(
{
"🗺️ Normal Map":streetMap
},
{
"⚓ Nautical Information":seaMap
},
{
collapsed:true
}
).addTo(map);


/* =========================
   VARIABLES
========================= */

let watchID = null;

let boatMarker = null;

let boatPosition = null;

let lastPosition = null;

let totalDistance = 0;

let route = [];

let routeLine = null;

let waypoints = [];


/* =========================
   START GPS
========================= */

function startGPS(){

if(!navigator.geolocation){

alert("Is device par GPS available nahi hai.");

return;

}


if(watchID !== null){

return;

}


document.getElementById("gps").innerText =
"Finding GPS...";


watchID =
navigator.geolocation.watchPosition(

function(position){

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

const current =
[lat,lon];


boatPosition =
current;


/* =========================
   DISTANCE
========================= */

if(lastPosition){

const distance =
map.distance(
lastPosition,
current
);

if(distance > 1){

totalDistance += distance;

}

}


lastPosition =
current;


/* =========================
   ROUTE
========================= */

route.push(current);


if(!routeLine){

routeLine =
L.polyline(
route,
{
weight:5
}
).addTo(map);

}else{

routeLine.setLatLngs(route);

}


/* =========================
   BOAT MARKER
========================= */

if(!boatMarker){

boatMarker =
L.marker(current)
.addTo(map)
.bindPopup("🚤 Aapki Boat");

}else{

boatMarker.setLatLng(current);

}


/* =========================
   SPEED
========================= */

let speed =
0;


if(
position.coords.speed !== null &&
position.coords.speed >= 0
){

speed =
position.coords.speed *
1.94384;

}


/* =========================
   HEADING
========================= */

let heading =
position.coords.heading;


/* =========================
   DASHBOARD
========================= */

document.getElementById("gps").innerText =
lat.toFixed(5)+
", "+
lon.toFixed(5);


document.getElementById("speed").innerText =
speed.toFixed(1)+
" kn";


document.getElementById("heading").innerText =
heading === null
?
"--"
:
heading.toFixed(0)+"°";


document.getElementById("distance").innerText =
totalDistance.toFixed(0)+
" m";


/* MOVE MAP */

map.setView(
current,
Math.max(map.getZoom(),14)
);

},

function(error){

alert(
"GPS Error: "+
error.message
);

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:20000
}

);

}


/* =========================
   STOP GPS
========================= */

function stopGPS(){

if(watchID !== null){

navigator.geolocation.clearWatch(
watchID
);

watchID = null;

document.getElementById("gps").innerText =
"GPS stopped";

}

}


/* =========================
   WAYPOINT
========================= */

function addWaypoint(){

if(!boatPosition){

alert(
"Pehle 🚤 Start dabayein."
);

return;

}


const marker =
L.marker(
boatPosition
)
.addTo(map)
.bindPopup(
"📌 SeaMate Waypoint<br>"+
boatPosition[0].toFixed(5)+
", "+
boatPosition[1].toFixed(5)
);


waypoints.push(marker);

marker.openPopup();

}


/* =========================
   SAVE ROUTE
========================= */

function saveRoute(){

if(route.length < 2){

alert(
"Pehle GPS se route record karein."
);

return;

}


localStorage.setItem(
"SeaMateRoute",
JSON.stringify(route)
);


alert(
"✅ Route successfully save ho gaya."
);

}


/* =========================
   LOAD ROUTE
========================= */

function loadRoute(){

const saved =
localStorage.getItem(
"SeaMateRoute"
);


if(!saved){

alert(
"Koi saved route nahi mila."
);

return;

}


const savedRoute =
JSON.parse(saved);


if(routeLine){

map.removeLayer(
routeLine
);

}


routeLine =
L.polyline(
savedRoute,
{
weight:5
}
).addTo(map);


map.fitBounds(
routeLine.getBounds()
);


alert(
"📂 Saved route load ho gaya."
);

}


/* =========================
   CLEAR ROUTE
========================= */

function clearRoute(){

if(routeLine){

map.removeLayer(
routeLine
);

routeLine = null;

}


route = [];

lastPosition = null;

totalDistance = 0;


document.getElementById(
"distance"
).innerText =
"0 m";


alert(
"🗑️ Current route clear ho gaya."
);

}


/* =========================
   BUTTON EVENTS
========================= */

document
.getElementById("startBtn")
.addEventListener(
"click",
startGPS
);


document
.getElementById("stopBtn")
.addEventListener(
"click",
stopGPS
);


document
.getElementById("waypointBtn")
.addEventListener(
"click",
addWaypoint
);


document
.getElementById("saveBtn")
.addEventListener(
"click",
saveRoute
);


document
.getElementById("loadBtn")
.addEventListener(
"click",
loadRoute
);


document
.getElementById("clearBtn")
.addEventListener(
"click",
clearRoute
);

</script>

</body>
</html>
