<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaMate Pakistan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #061a2b;
  color: white;
}

header {
  background: #087ea4;
  padding: 16px;
  text-align: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.4);
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
}

.container {
  padding: 15px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: #0c2940;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.25);
}

.card h2 {
  margin-top: 0;
  font-size: 19px;
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dot {
  width: 14px;
  height: 14px;
  background: #20d46b;
  border-radius: 50%;
  box-shadow: 0 0 10px #20d46b;
}

.map {
  height: 250px;
  border-radius: 12px;
  background:
    linear-gradient(rgba(0,80,120,.5), rgba(0,30,60,.8)),
    repeating-linear-gradient(
      45deg,
      #07506e,
      #07506e 10px,
      #064764 10px,
      #064764 20px
    );
  position: relative;
  overflow: hidden;
}

.map-title {
  position: absolute;
  top: 15px;
  left: 15px;
  background: rgba(0,0,0,.55);
  padding: 8px 12px;
  border-radius: 8px;
}

.location {
  position: absolute;
  left: 48%;
  top: 45%;
  font-size: 35px;
}

.map-controls {
  position: absolute;
  right: 10px;
  bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.map-controls button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: white;
  color: #06243a;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button.main {
  border: none;
  padding: 14px;
  border-radius: 10px;
  background: #0a91bd;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button.main:active,
.map-controls button:active {
  transform: scale(.96);
}

.info {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.info:last-child {
  border-bottom: none;
}

footer {
  text-align: center;
  padding: 20px;
  color: #9bb4c4;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>⚓ SeaMate Pakistan</h1>
  <p>Marine Safety & Assistance App</p>
</header>

<div class="container">

  <div class="card">
    <h2>📡 Signal Status</h2>

    <div class="status">
      <span class="dot"></span>
      <div>
        <strong>Connected</strong><br>
        <small>SeaMate service active</small>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🗺️ Marine Map</h2>

    <div class="map" id="map">
      <div class="map-title">📍 Your Location</div>

      <div class="location">🚢</div>

      <div class="map-controls">
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomOut()">−</button>
        <button onclick="resetZoom()">⌾</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🚨 Emergency</h2>

    <div class="buttons">
      <button class="main" onclick="emergency()">
        🚨 Emergency
      </button>

      <button class="main" onclick="shareLocation()">
        📍 Share Location
      </button>

      <button class="main" onclick="weather()">
        🌦️ Weather
      </button>

      <button class="main" onclick="help()">
        ℹ️ Help
      </button>
    </div>
  </div>

  <div class="card">
    <h2>📊 Sea Information</h2>

    <div class="info">
      <span>🌊 Sea Status</span>
      <strong>Active</strong>
    </div>

    <div class="info">
      <span>🚢 Marine Area</span>
      <strong>Pakistan</strong>
    </div>

    <div class="info">
      <span>📡 Connection</span>
      <strong>Available</strong>
    </div>
  </div>

</div>

<footer>
  SeaMate Pakistan © 2026
</footer>

<script>

let zoom = 1;

function updateZoom() {
  const map = document.getElementById("map");
  map.style.backgroundSize = (100 * zoom) + "% " + (100 * zoom) + "%";
}

function zoomIn() {
  if (zoom < 2) {
    zoom += 0.2;
    updateZoom();
  }
}

function zoomOut() {
  if (zoom > 0.6) {
    zoom -= 0.2;
    updateZoom();
  }
}

function resetZoom() {
  zoom = 1;
  updateZoom();
}

function emergency() {
  alert("🚨 Emergency mode activated.\nPlease contact the nearest marine rescue service.");
}

function shareLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        alert(
          "📍 Location found\n\nLatitude: " +
          lat +
          "\nLongitude: " +
          lon
        );
      },
      function() {
        alert("Location permission is required.");
      }
    );
  } else {
    alert("Location is not supported on this device.");
  }
}

function weather() {
  alert("🌦️ Weather service will be connected in the next version.");
}

function help() {
  alert(
    "⚓ SeaMate Pakistan\n\n" +
    "Use the buttons above for marine assistance, location and emergency information."
  );
}

</script>

</body>
</html>
