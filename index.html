<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#063b5c">
<meta name="description" content="SeaMate Pakistan Marine GPS and Navigation">

<title>SeaMate Pakistan</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#071923;
  color:white;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:58px;
  min-height:58px;
  background:#063b5c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 10px;
  border-bottom:2px solid #1f789e;
}

.logoArea{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:9px;
  background:#0b668e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  border:1px solid #55c7e8;
}

.title{
  font-size:17px;
  font-weight:bold;
}

.subtitle{
  font-size:10px;
  color:#a9dbea;
  margin-top:2px;
}

.status{
  text-align:right;
}

.gpsStatus{
  font-size:12px;
  color:#65ef9c;
  font-weight:bold;
}

.freeStatus{
  font-size:10px;
  color:#ffd76a;
}

/* NAV DATA */
.navData{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:4px;
  padding:5px;
  background:#0b2430;
}

.dataBox{
  background:#092c3b;
  border:1px solid #1b6279;
  border-radius:5px;
  padding:4px;
  text-align:center;
}

.dataLabel{
  font-size:9px;
  color:#8fb5c2;
}

.dataValue{
  font-size:13px;
  font-weight:bold;
  margin-top:2px;
}

/* COMPASS */
.compass{
  height:35px;
  min-height:35px;
  overflow:hidden;
  background:#03141d;
  border-bottom:1px solid #17546b;
  position:relative;
}

.compassScale{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-around;
  color:#d7eef5;
  font-size:10px;
}

.headingMark{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  height:100%;
  width:2px;
  background:#ff4d4d;
}

.headingMark:after{
  content:"";
  position:absolute;
  top:0;
  left:-5px;
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:7px solid #ff4d4d;
}

/* MAP */
#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#0a3446;
}

.leaflet-control-zoom{
  margin-top:8px!important;
}

.leaflet-control-zoom a{
  width:36px!important;
  height:36px!important;
  line-height:36px!important;
  font-size:22px!important;
}

/* BOAT */
.boatIcon{
  width:38px;
  height:38px;
  background:#ff3434;
  border:3px solid white;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  box-shadow:0 2px 8px #000;
  position:relative;
}

.boatIcon span{
  position:absolute;
  transform:rotate(45deg);
  font-size:20px;
  left:7px;
  top:5px;
}

/* BOTTOM */
.bottomPanel{
  background:#071923;
  border-top:2px solid #1c6078;
  padding:5px;
}

.quickData{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  margin-bottom:5px;
}

.quick{
  background:#0b2e3c;
  border:1px solid #1c6278;
  border-radius:5px;
  text-align:center;
  padding:4px;
}

.quick b{
  display:block;
  font-size:13px;
}

.quick span{
  color:#88afbb;
  font-size:8px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

button{
  border:0;
  border-radius:5px;
  padding:9px 3px;
  color:white;
  background:#0b6285;
  font-size:10px;
  font-weight:bold;
  min-height:38px;
}

button:active{
  transform:scale(.96);
}

.green{background:#087a55}
.red{background:#a92c35}
.orange{background:#a96608}
.dark{background:#273f49}

/* LAYERS PANEL */
.panel{
  position:absolute;
  z-index:9999;
  left:7px;
  right:7px;
  bottom:165px;
  background:rgba(4,25,35,.97);
  border:1px solid #398aa5;
  border-radius:10px;
  padding:10px;
  box-shadow:0 5px 25px #000;
  display:none;
}

.panel h3{
  margin:0 0 8px;
  font-size:15px;
}

.layerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 4px;
  border-bottom:1px solid #194552;
  font-size:12px;
}

.layerRow:last-child{
  border-bottom:0;
}

.switch{
  width:45px;
  height:24px;
  background:#33434a;
  border-radius:20px;
  position:relative;
}

.switch.on{
  background:#008c63;
}

.switch i{
  position:absolute;
  width:20px;
  height:20px;
  background:white;
  border-radius:50%;
  top:2px;
  left:2px;
  transition:.2s;
}

.switch.on i{
  left:23px;
}

.info{
  margin-top:7px;
  padding:7px;
  border-radius:6px;
  background:#0b3342;
  color:#a9cbd5;
  font-size:9px;
  line-height:1.4;
}

/* GPS INFO */
.gpsPanel{
  position:absolute;
  z-index:9999;
  top:103px;
  left:7px;
  right:7px;
  background:rgba(3,24,34,.95);
  border:1px solid #3886a0;
  border-radius:8px;
  padding:8px;
  display:none;
}

.gpsPanel b{
  color:#68e6ff;
}

/* MAP LABEL */
.mapLabel{
  position:absolute;
  z-index:900;
  left:8px;
  top:8px;
  background:rgba(0,20,30,.8);
  border:1px solid #28738e;
  padding:5px 8px;
  border-radius:5px;
  font-size:9px;
}

/* DEPTH INFO */
.depthBox{
  position:absolute;
  z-index:900;
  right:8px;
  top:8px;
  background:rgba(0,20,30,.86);
  border:1px solid #28738e;
  padding:6px 8px;
  border-radius:6px;
  font-size:9px;
}

.depthBox strong{
  color:#54ddff;
  font-size:12px;
}

/* HELP */
.helpPanel{
  position:absolute;
  z-index:9999;
  left:7px;
  right:7px;
  top:100px;
  background:rgba(3,24,34,.98);
  border:1px solid #398aa5;
  border-radius:10px;
  padding:12px;
  display:none;
  font-size:11px;
  line-height:1.5;
}

.helpPanel h3{
  margin-top:0;
}

/* RESPONSIVE */
@media(max-width:360px){
  .title{font-size:15px}
  button{font-size:9px;padding:7px 2px}
  .buttons{grid-template-columns:repeat(5,1fr)}
}

@media(min-width:700px){
  .bottomPanel{
    padding:8px 20px;
  }

  .buttons{
    max-width:850px;
    margin:auto;
  }

  .quickData{
    max-width:700px;
    margin:0 auto 6px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div class="header">

    <div class="logoArea">
      <div class="logo">⚓</div>

      <div>
        <div class="title">SeaMate Pakistan</div>
        <div class="subtitle">Marine GPS & Navigation</div>
      </div>
    </div>

    <div class="status">
      <div id="gpsStatus" class="gpsStatus">GPS OFF</div>
      <div id="premiumStatus" class="freeStatus">FREE</div>
    </div>

  </div>


  <!-- NAVIGATION DATA -->
  <div class="navData">

    <div class="dataBox">
      <div class="dataLabel">LATITUDE</div>
      <div id="lat" class="dataValue">--</div>
    </div>

    <div class="dataBox">
      <div class="dataLabel">LONGITUDE</div>
      <div id="lon" class="dataValue">--</div>
    </div>

    <div class="dataBox">
      <div class="dataLabel">COG</div>
      <div id="cog" class="dataValue">--°</div>
    </div>

  </div>


  <!-- COMPASS -->
  <div class="compass">

    <div class="headingMark"></div>

    <div class="compassScale">
      <span>000°</span>
      <span>030°</span>
      <span>060°</span>
      <span>090°</span>
      <span>120°</span>
      <span>150°</span>
      <span>180°</span>
      <span>210°</span>
      <span>240°</span>
      <span>270°</span>
      <span>300°</span>
      <span>330°</span>
    </div>

  </div>


  <!-- MAP -->
  <div id="map"></div>


  <div class="mapLabel">
    SEA-MATE CHART
  </div>

  <div class="depthBox">
    DEPTH<br>
    <strong id="depthText">Chart layer</strong>
  </div>


  <!-- BOTTOM -->
  <div class="bottomPanel">

    <div class="quickData">

      <div class="quick">
        <b id="speed">0.0 kn</b>
        <span>SPEED</span>
      </div>

      <div class="quick">
        <b id="heading">0°</b>
        <span>HEADING</span>
      </div
