<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeaMate Pakistan</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .panel {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #087ea4;
      color: white;
      font-weight: bold;
    }

    #info {
      position: fixed;
      z-index: 9999;
      bottom: 15px;
      left: 10px;
      right: 10px;
      background: white;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="panel">
  <button onclick="startTracking()">🚤 Start Tracking</button>
  <button onclick="stopTracking()">⛔ Stop</button>
  <button onclick="addWaypoint()">📌 Waypoint</button>
  <button onclick="clearWaypoints()">🗑️ Clear</button>
</div>

<div id="map"></div>

<div id="info">
  GPS: Waiting...<br>
  Speed: 0 knots<br>
  Distance: 0 m
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([24.85, 67.00], 10);


// Normal map
const streetMap = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);


// Marine / nautical layer
const marineMap = L.tileLayer(
  "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    opacity: 1,
    attribution: "Nautical data © OpenSeaMap"
  }
).addTo(map);


// Layer control
L.control.layers(
  {
    "🗺️ Normal Map": streetMap
  },
  {
    "⚓ Nautical Information": marineMap
  }
).addTo(map);


let boat = null;
let watchID = null;
let boatPosition = null;
let previousPosition = null;
let totalDistance = 0;
let waypoints = [];


// GPS TRACKING
function startTracking() {

  if (!navigator.geolocation) {
    alert("GPS available nahi hai.");
    return;
  }

  if (watchID !== null) {
    return;
  }

  watchID = navigator.geolocation.watchPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const current = [lat, lon];

      if (previousPosition) {

        const distance = map.distance(
          previousPosition,
          current
        );

        if (distance > 1) {
          totalDistance += distance;
        }
      }

      previousPosition = current;
      boatPosition = current;


      if (!boat) {

        boat = L.marker(current)
          .addTo(map)
          .bindPopup("🚤 Aapki Boat");

      } else {

        boat.setLatLng(current);

      }


      map.setView(current);


      let speedKnots = 0;

      if (position.coords.speed !== null) {

        speedKnots =
          position.coords.speed * 1.94384;

      }


      document.getElementById("info").innerHTML =
        "GPS: " +
        lat.toFixed(5) +
        ", " +
        lon.toFixed(5) +
        "<br>Speed: " +
        speedKnots.toFixed(1) +
        " knots" +
        "<br>Distance: " +
        totalDistance.toFixed(0) +
        " m";

    },

    function(error) {

      alert(
        "GPS error: " +
        error.message
      );

    },

    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    }

  );
}


// STOP
function stopTracking() {

  if (watchID !== null) {

    navigator.geolocation.clearWatch(watchID);

    watchID = null;
  }

}


// WAYPOINT
function addWaypoint() {

  if (!boatPosition) {

    alert("Pehle Start Tracking dabayein.");

    return;
  }

  const waypoint = L.marker(boatPosition)
    .addTo(map)
    .bindPopup("📌 Waypoint");

  waypoints.push(waypoint);

}


// CLEAR WAYPOINTS
function clearWaypoints() {

  waypoints.forEach(function(marker) {

    map.removeLayer(marker);

  });

  waypoints = [];

}

</script>

</body>
</html>
